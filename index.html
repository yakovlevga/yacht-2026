document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fpath>\n            <path d=\"M1 -144 Q48 -86 60 -30 L1 -30 Z\" fill=\"#FFFDF8\" stroke=\"#22304A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n            <path d=\"M1 -100 L40 -100\" stroke=\"#57BFC4\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M1 -76 L50 -76\" stroke=\"#57BFC4\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M-9 -136 L-9 -32 L-56 -32 Q-38 -86 -9 -136 Z\" fill=\"#EDBE5A\" stroke=\"#22304A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n            <path d=\"M-4 -150 L16 -143 L-4 -136 Z\" fill=\"#C0643F\"><\u002Fpath>\n            <path d=\"M-46 -12 L-38 -30 L40 -30 L52 -12 Z\" fill=\"#FFFDF8\" stroke=\"#22304A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n            <path d=\"M-28 -21 L-14 -21 M-4 -21 L10 -21 M20 -21 L34 -21\" stroke=\"#22304A\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M-80 -12 L82 -12 Q76 8 60 12 L-62 12 Q-76 8 -80 -12 Z\" fill=\"#FFFDF8\" stroke=\"#22304A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpath>\n            <text x=\"0\" y=\"5\" text-anchor=\"middle\" style=\"font-family:Caveat,cursive;font-size:15px;font-weight:700;fill:#C0643F\">Santa Ana<\u002Ftext>\n          <\u002Fg>\n        <g transform=\"translate(0 448)\"><path ref=\"{{ wave2 }}\" d=\"M-240 20 q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V200 H-240 Z\" fill=\"#23779A\" stroke=\"#22304A\" stroke-width=\"2\"><\u002Fpath><\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"background:#23779A;color:#FBF6EC\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:8px 24px 36px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px\">\n        <div style=\"background:#FFFDF8;color:#22304A;border:1.5px solid #22304A;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F\">лодка<\u002Fdiv><div style=\"font-size:15px;font-weight:700;line-height:1.35\">Bali 4.6 «Santa Ana», 2025<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FFFDF8;color:#22304A;border:1.5px solid #22304A;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F\">холод<\u002Fdiv><div style=\"font-size:15px;font-weight:700;line-height:1.35\">Холодильник + морозилка 615 л, 220 В<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FFFDF8;color:#22304A;border:1.5px solid #22304A;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F\">вода<\u002Fdiv><div style=\"font-size:15px;font-weight:700;line-height:1.35\">Опреснитель 240 л/ч + бак 860 л<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FFFDF8;color:#22304A;border:1.5px solid #22304A;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\"><div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F\">камбуз<\u002Fdiv><div style=\"font-size:15px;font-weight:700;line-height:1.35\">Электропланча, индукция, духовка, посудомойка, Nespresso<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;line-height:1.55;max-width:760px\">Расчёт: парни ×1.25 порции → 10 «условных порций». На ужин ~200–250 г сырого мяса или рыбы на человека — это ≈ 40 г чистого белка; за день ≈ 90–110 г белка (≈ 1,3–1,6 г на кг веса). Овощи и салат ~500 г на человека в день.<\u002Fp>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 1200 40\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:36px\"><path d=\"M0 40 V20 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V40 Z\" fill=\"#FBF6EC\"><\u002Fpath><\u002Fsvg>\n  <\u002Fsection>\n\n  <main style=\"max-width:1120px;width:100%;box-sizing:border-box;margin:0 auto;padding:36px 24px 40px;display:flex;flex-direction:column;gap:64px\">\n\n    <section style=\"display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <div style=\"font-family:Caveat,cursive;font-size:24px;font-weight:700;color:#C0643F\">le menu<\u002Fdiv>\n          <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(36px,5vw,54px);line-height:1\">Меню по дням<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;font-size:13px;font-weight:700\">\n          <div style=\"display:flex;align-items:center;gap:7px\"><div style=\"width:14px;height:14px;border-radius:50%;background:#EEE8F7;border:1.5px solid #22304A\"><\u002Fdiv>Закуп 1<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px\"><div style=\"width:14px;height:14px;border-radius:50%;background:#DDF1EF;border:1.5px solid #22304A\"><\u002Fdiv>Закуп 2<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px\">\n        <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"background:#FFFDF8;border:1.5px solid #22304A;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 #22304A\">\n            <div style=\"padding:12px 18px 10px;background:{{ d.tint }};border-bottom:1.5px solid #22304A;display:flex;justify-content:space-between;align-items:center;gap:8px\">\n              <div style=\"display:flex;align-items:baseline;gap:8px\">\n                <div style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:40px;line-height:1\">{{ d.num }}<\u002Fdiv>\n                <div style=\"font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">{{ d.title }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:Caveat,cursive;font-size:19px;font-weight:700;color:#8E4428;text-align:right;line-height:1.05\">{{ d.tag }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ d.meals }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <div style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#23779A\">{{ m.k }}<\u002Fdiv>\n                  <div style=\"font-size:14.5px;line-height:1.42;text-wrap:pretty\">{{ m.t }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"font-family:Caveat,cursive;font-size:24px;font-weight:700;color:#C0643F\">au marché<\u002Fdiv>\n          <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(36px,5vw,54px);line-height:1\">Список закупки<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"noprint\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n          <div style=\"font-size:13px;font-weight:600;color:rgba(34,48,74,.7)\">Куплено {{ doneCount }} из {{ totalCount }} · заменено {{ subCount }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ resetChecks }}\" style=\"font:inherit;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid #22304A;background:#FFFDF8;color:#22304A;cursor:pointer\">Сбросить<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"noprint\" style=\"margin:-8px 0 0;font-size:14px;line-height:1.5;color:rgba(34,48,74,.7);max-width:720px\">Нажмите на строку — отметится как купленное. «Замена» — если в магазине не было, впишите, что взяли вместо. Всё сохраняется в этом браузере.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-items:start\">\n        <sc-for list=\"{{ purchases }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"background:#FFFDF8;border:1.5px solid #22304A;border-radius:28px;overflow:hidden;box-shadow:5px 5px 0 #22304A\">\n            <div style=\"padding:22px 24px 18px;background:{{ p.tint }};border-bottom:1.5px solid #22304A;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n                <div style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:38px;line-height:1\">{{ p.title }}<\u002Fdiv>\n                <div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#8E4428\">{{ p.when }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.5;color:rgba(34,48,74,.8)\">{{ p.covers }}<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:6px\">\n                <div style=\"padding:5px 11px;border-radius:999px;background:#FFFDF8;border:1.5px solid #22304A;font-size:12px;font-weight:800;white-space:nowrap\">Белок ≈ {{ p.proteinKg }} кг<\u002Fdiv>\n                <div style=\"padding:5px 11px;border-radius:999px;background:#FFFDF8;border:1.5px solid #22304A;font-size:12px;font-weight:800;white-space:nowrap\">Овощи ≈ {{ p.vegKg }} кг<\u002Fdiv>\n                <div style=\"padding:5px 11px;border-radius:999px;background:#FFFDF8;border:1.5px solid #22304A;font-size:12px;font-weight:800;white-space:nowrap\">Фрукты ≈ {{ p.fruitKg }} кг<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:6px 24px 22px;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ p.cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-direction:column;padding-top:18px\">\n                  <div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F;padding-bottom:4px\">{{ c.name }}<\u002Fdiv>\n                  <sc-for list=\"{{ c.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                    <div style=\"border-top:1px dashed rgba(34,48,74,.22);display:flex;flex-direction:column\">\n                      <div sc-camel-on-click=\"{{ it.toggle }}\" style=\"display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;cursor:pointer;opacity:{{ it.opacity }}\">\n                        <div style=\"width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid {{ it.boxBorder }};background:{{ it.boxBg }};color:#FFFDF8;font-size:11px;font-weight:800;line-height:18px;text-align:center\">{{ it.mark }}<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                          <div style=\"font-size:15px;font-weight:600;line-height:1.35;text-decoration:{{ it.deco }}\">{{ it.label }}<\u002Fdiv>\n                          <div style=\"font-size:12.5px;line-height:1.35;color:{{ it.noteColor }}\">{{ it.subNote }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:4px\">\n                          <div style=\"font-size:15px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ it.qtyLabel }}<\u002Fdiv>\n                          <button class=\"noprint\" sc-camel-on-click=\"{{ it.startEdit }}\" style=\"font:inherit;font-size:12px;font-weight:700;padding:6px 12px;min-height:30px;border-radius:999px;border:1px solid rgba(34,48,74,.35);background:transparent;color:#23779A;cursor:pointer;white-space:nowrap\">{{ it.editLabel }}<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ it.isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div class=\"noprint\" style=\"margin:0 0 12px 30px;padding:12px;border-radius:16px;background:#DDF1EF;border:1.5px solid #22304A;display:flex;flex-direction:column;gap:8px\">\n                          <div style=\"font-size:12px;font-weight:700\">Вместо «{{ it.name }}» взяли:<\u002Fdiv>\n                          <input data-sub-input=\"1\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ onDraftKey }}\" placeholder=\"например, лубин вместо дорадо\" style=\"font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid #22304A;background:#FFFDF8;color:#22304A;outline:none\">\n                          <sc-if value=\"{{ it.hasAlts }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                              <sc-for list=\"{{ it.alts }}\" as=\"al\" hint-placeholder-count=\"2\">\n                                <button sc-camel-on-click=\"{{ al.pick }}\" style=\"font:inherit;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid #22304A;background:#FFFDF8;color:#22304A;cursor:pointer\">{{ al.label }}<\u002Fbutton>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                            <button sc-camel-on-click=\"{{ commitEdit }}\" style=\"font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;border:1.5px solid #22304A;background:#22304A;color:#FBF6EC;cursor:pointer\">Сохранить<\u002Fbutton>\n                            <sc-if value=\"{{ it.hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n                              <button sc-camel-on-click=\"{{ it.clearSub }}\" style=\"font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;border:1.5px solid #22304A;background:#FFFDF8;color:#22304A;cursor:pointer\">Вернуть исходное<\u002Fbutton>\n                            <\u002Fsc-if>\n                            <button sc-camel-on-click=\"{{ cancelEdit }}\" style=\"font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:#22304A;cursor:pointer\">Отмена<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start\">\n      <div style=\"background:#FFFDF8;border:1.5px solid #22304A;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 #22304A\">\n        <div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F\">было → стало<\u002Fdiv>\n        <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:32px;line-height:1.05\">Что поменяли в исходном списке<\u002Fh3>\n        <sc-for list=\"{{ changes }}\" as=\"ch\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding-top:10px;border-top:1px dashed rgba(34,48,74,.22);font-size:14px;line-height:1.42\">\n            <div style=\"color:rgba(34,48,74,.55);text-decoration:line-through\">{{ ch.from }}<\u002Fdiv>\n            <div style=\"font-weight:700\">{{ ch.to }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#EEE8F7;border:1.5px solid #22304A;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 #22304A\">\n        <div style=\"font-family:Caveat,cursive;font-size:22px;font-weight:700;color:#C0643F\">art de vivre<\u002Fdiv>\n        <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:32px;line-height:1.05\">Чтобы было «как в отеле»<\u002Fh3>\n        <sc-for list=\"{{ tips }}\" as=\"tp\" hint-placeholder-count=\"6\">\n          <div style=\"font-size:14.5px;line-height:1.5;padding-top:10px;border-top:1px dashed rgba(34,48,74,.25);text-wrap:pretty\">{{ tp }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer style=\"margin-top:auto\">\n    <div style=\"text-align:center;font-family:Caveat,cursive;font-size:34px;font-weight:700;color:#8E4428;padding:0 24px 8px\">Bon appétit &amp; bon vent !<\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 1200 110\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:90px\">\n      <path d=\"M0 110 V40 q20 -22 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V110 Z\" fill=\"#CFC3E6\" stroke=\"#22304A\" stroke-width=\"2\"><\u002Fpath>\n      <path d=\"M-20 110 V66 q20 -22 40 0 t40 0 t40 0 t40 0 t ,\n  'Лосось слабосолёный': ['Копчёная форель', 'Gravlax'],\n  'Прошутто': ['Jambon de Bayonne', 'Хамон'],\n  'Куриная ветчина': ['Ветчина из индейки (blanc de dinde)', 'Jambon blanc'],\n  'Буррата': ['Моцарелла ди буфала', 'Страчателла'],\n  'Греческий йогурт': ['Fromage blanc', 'Скир'],\n  'Фета': ['Козий сыр (chèvre frais)', 'Брынза'],\n  'Мидии': ['Вонголе', 'Креветки'],\n  'Рукола': ['Mesclun', 'Шпинат baby'],\n  'Авокадо': ['Больше огурцов и черри'],\n  'Ягоды': ['Инжир', 'Виноград'],\n  'Пассата': ['Томаты в с/с', 'Coulis de tomates'],\n  'Хумус': ['Тапенад', 'Тарамасалата'],\n  'Шпинат': ['Мангольд', 'Рукола'],\n};\n\nconst CHANGES = [\n  ['Конфеты 2.1 кг, печенье и вафли 3.5 кг, шоколад 2.1 кг', 'Ягоды, арбуз, дыня, инжир, финики + 4 плитки тёмного шоколада'],\n  ['Сахар 2.1 кг', '0.3 кг — только к кофе'],\n  ['Колбаса, сосиски 3.5 кг', 'Прошутто / хамон 1.2 кг'],\n  ['Майонез 2.1 кг', 'Йогурт, оливковое масло, дзадзики, тахини'],\n  ['Мясо и рыба «в т.ч. консервы» по 10.5 кг', '≈ 30 кг свежего белка: мидии, дорадо, тунец, лосось, ягнёнок, курица'],\n  ['Овощи для салата 10.5 кг', '≈ 35 кг овощей, салатов и зелени'],\n  ['Картофель 7 кг, макароны, мука', '3 кг картофеля и 1 кг риса'],\n  ['Сливочное масло 2.1 кг, растительное 2.8 л', 'Сливочное 0.3 кг, оливковое EV 2.5 л'],\n];\n\nconst TIPS = [\n  'Креветки — один ужин в первый день: брать замороженные, размораживать в холодильнике и готовить сразу. Мидии — живыми во втором закупе, в тот же вечер.',\n  'Морозилка: креветки, ягнятина на д.6, 2 кг курицы и лёд. Всё остальное — в холодильник: рыба на нижнюю полку, зелень и салат — в ящики.',\n  'Маринад для всего один: оливковое масло, чеснок, лимон, соль. Мясо и рыбу — на электропланчу, овощи рядом. Посуду — в посудомойку.',\n  'Сделать банку универсальной заправки на 2–3 дня: оливковое масло, лимон, дижон, мёд, соль.',\n  'Холодильник — это 615 л на 9 человек. Вино и воду охлаждать партиями на день, остальное держать в рундуках: холодильник не для запасов напитков.',\n  'Пассата — палочка-выручалочка: яйца в томатах, курица или рыба в томатах, паста за 15 минут.',\n  'Опреснитель даёт питьевую воду — бутылки нужны только на первые дни. Алкоголь не включён; для мидий — бутылка сухого белого (Кассис или Бандоль).',\n];\n\nclass Component extends DCLogic {\n  state = { checked: {}, subs: {}, editing: null, draft: '' };\n  boatRefs = [0, 1, 2, 3].map(() => React.createRef());\n  waveRefs = [0, 1, 2].map(() => React.createRef());\n  gullRefs = [0, 1].map(() => React.createRef());\n  componentDidMount() {\n    try {\n      const c = JSON.parse(localStorage.getItem('yacht-provision-checks') || '{}');\n      const sb = JSON.parse(localStorage.getItem('yacht-provision-subs') || '{}');\n      this.setState({ checked: c, subs: sb });\n    } catch (e) {}\n    this.startAnim();\n    this.firstTap = e => {\n      if (e && e.target && e.target.closest && e.target.closest('button')) return;\n      ['pointerdown', 'keydown', 'touchstart'].forEach(t => window.removeEventListener(t, this.firstTap, true));\n      if (!this.state.sound) this.setState({ sound: true });\n    };\n    ['pointerdown', 'keydown', 'touchstart'].forEach(t => window.addEventListener(t, this.firstTap, true));\n  }\n  componentDidUpdate(prev, prevState) {\n    if (prev.motion !== this.props.motion) { this.stopAnim(); this.startAnim(); }\n    if (this.state.editing && this.state.editing !== prevState.editing) {\n      const el = document.querySelector('[data-sub-input]'); if (el) el.focus();\n    }\n  }\n  componentWillUnmount() {\n    this.stopAnim();\n    if (this.firstTap) ['pointerdown', 'keydown', 'touchstart'].forEach(t => window.removeEventListener(t, this.firstTap, true));\n  }\n  stopAnim() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = null; }\n  startAnim() {\n    if (this.raf || this.props.motion === false) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const B = [\n      { r: this.boatRefs[0], x0: 460, y: 382, s: 0.42, v: 7 },\n      { r: this.boatRefs[1], x0: 960, y: 424, s: 0.72, v: -12 },\n      { r: this.boatRefs[2], x0: 620, y: 470, s: 1, v: 15 },\n      { r: this.boatRefs[3], x0: 1200, y: 380, s: 0.4, v: -6 },\n    ];\n    const W = [{ r: this.waveRefs[0], v: 9 }, { r: this.waveRefs[1], v: -14 }, { r: this.waveRefs[2], v: 20 }];\n    const G = [{ r: this.gullRefs[0], x0: 500, y: 110, v: 24 }, { r: this.gullRefs[1], x0: 900, y: 80, v: 17 }];\n    const t0 = performance.now();\n    const loop = now => {\n      const t = (now - t0) / 1000;\n      B.forEach(b => {\n        const el = b.r.current; if (!el) return;\n        const x = (((b.x0 + b.v * t) % 1600) + 1600) % 1600 - 200;\n        const ph = b.x0 / 100;\n        const y = b.y + Math.sin(t * 1.3 + ph) * 3.5 * b.s;\n        const rot = Math.sin(t * 1.3 + ph + 0.8) * 3;\n        const sx = b.v < 0 ? -b.s : b.s;\n        el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + rot.toFixed(2) + ') scale(' + sx + ' ' + b.s + ')');\n      });\n      W.forEach(w => { const el = w.r.current; if (el) el.setAttribute('transform', 'translate(' + ((w.v * t) % 120).toFixed(1) + ' 0)'); });\n      G.forEach(g => {\n        const el = g.r.current; if (!el) return;\n        const x = ((g.x0 + g.v * t) % 1600) - 200;\n        const y = g.y + Math.sin(t * 0.8 + g.x0) * 8;\n        const fl = 0.45 + 0.55 * Math.abs(Math.sin(t * 4 + g.x0));\n        el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') scale(1 ' + fl.toFixed(2) + ')');\n      });\n      this.raf = requestAnimationFrame(loop);\n    };\n    this.raf = requestAnimationFrame(loop);\n  }\n  videoVals() {\n    const raw = this.props.videoUrl ?? 'https://www.youtube.com/watch?v=Ua-DaWrTsVY';\n    const m = String(raw).match(/(?:v=|youtu\\.be\\/|embed\\/|shorts\\/)([\\w-]{11})/) || String(raw).match(/^([\\w-]{11})$/);\n    const id = m ? m[1] : 'Ua-DaWrTsVY';\n    const on = !!this.state.sound;\n    return {\n      videoSrc: 'https://www.youtube.com/embed/' + id + '?autoplay=1&mute=' + (on ? 0 : 1) + '&loop=1&playlist=' + id + '&playsinline=1&rel=0' + (/^https?:/.test(location.origin) ? '&origin=' + encodeURIComponent(location.origin) : ''),\n      unmute: () => {\n        if (this.firstTap) ['pointerdown', 'keydown', 'touchstart'].forEach(t => window.removeEventListener(t, this.firstTap, true));\n        this.setState(s => ({ sound: !s.sound }));\n      },\n      soundLabel: on ? 'Выключить звук' : 'Включить звук',\n      soundBg: on ? '#FFFDF8' : '#22304A', soundFg: on ? '#22304A' : '#FBF6EC',\n    };\n  }\n  saveSubs(sb) { try { localStorage.setItem('yacht-provision-subs', JSON.stringify(sb)); } catch (e) {} }\n  commit(id, text) {\n    const v = (text || '').trim();\n    this.setState(s => {\n      const subs = { ...s.subs }; const checked = { ...s.checked };\n      if (v) { subs[id] = v; checked[id] = true; } else delete subs[id];\n      this.saveSubs(subs); this.save(checked);\n      return { subs, checked, editing: null, draft: '' };\n    });\n  }\n  altsFor(name) {\n    const k = Object.keys(ALTS).find(key => name.startsWith(key));\n    return k ? ALTS[k] : [];\n  }\n  save(c) { try { localStorage.setItem('yacht-provision-checks', JSON.stringify(c)); } catch (e) {} }\n  toggle(id) {\n    this.setState(s => { const c = { ...s.checked, [id]: !s.checked[id] }; this.save(c); return { checked: c }; });\n  }\n  scale(q, unit, group, k) {\n    if (group === 'fix') return q;\n    const v = q * k;\n    if (['кг', 'л'].includes(unit)) return Math.round(v * 10) / 10;\n    return Math.ceil(v);\n  }\n  build(src, pid, k) {\n    const sum = { pr: 0, veg: 0, fr: 0 };\n    let done = 0, total = 0;\n    const cats = src.map(([name, items], ci) => ({\n      name,\n      items: items.map(([n, q, u, note, g], ii) => {\n        const id = pid + '-' + ci + '-' + ii;\n        const qty = this.scale(q, u, g, k);\n        if (g === 'pr' && u === 'кг') sum.pr += qty;\n        if (g === 'prw') sum.pr += qty * 0.45;\n        if (g === 'veg') sum.veg += qty;\n        if (g === 'vegw') sum.veg += qty * 0.2;\n        if (g === 'fr') sum.fr += qty;\n        const on = !!this.state.checked[id];\n        total++; if (on) done++;\n        const sub = this.state.subs[id];\n        const editing = this.state.editing === id;\n        const alts = this.altsFor(n);\n        return {\n          name: n, note, qtyLabel: String(qty).replace('.', ',') + ' ' + u,\n          label: sub ? '↺ ' + sub : n,\n          subNote: sub ? 'вместо: ' + n : note,\n          noteColor: sub ? '#23779A' : 'rgba(34,48,74,.58)',\n          hasSub: !!sub, isEditing: editing,\n          editLabel: sub ? 'изменить' : 'замена',\n          hasAlts: alts.length > 0,\n          alts: alts.map(label => ({ label, pick: () => this.commit(id, label) })),\n          startEdit: e => { e.stopPropagation(); this.setState(s => ({ editing: s.editing === id ? null : id, draft: s.subs[id] || '' })); },\n          clearSub: () => this.commit(id, ''),\n          toggle: () => this.toggle(id),\n          opacity: on && !sub ? 0.5 : 1, deco: on && !sub ? 'line-through' : 'none',\n          boxBg: on ? (sub ? '#23779A' : '#C0643F') : '#FFFDF8', boxBorder: on ? (sub ? '#23779A' : '#C0643F') : 'rgba(34,48,74,.4)', mark: on ? '✓' : '',\n        };\n      }),\n    }));\n    const f = v => String(Math.round(v)).replace('.', ',');\n    return { cats, proteinKg: f(sum.pr), vegKg: f(sum.veg), fruitKg: f(sum.fr), done, total };\n  }\n  renderVals() {\n    const bufferPct = this.props.buffer ?? 10;\n    const k = 1 + bufferPct / 100;\n    const a = this.build(P1, 'p1', k), b = this.build(P2, 'p2', k);\n    const tint = p => (p === 1 ? '#EEE8F7' : '#DDF1EF');\n    return {\n      bufferPct,\n      days: MENU.map((d, i) => ({ num: '0' + (i + 1), title: d.title, tag: d.tag, tint: tint(d.p), meals: d.meals.map(([k2, t]) => ({ k: k2, t })) })),\n      purchases: [\n        { title: 'Закуп
